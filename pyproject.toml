[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-store"
# Pre-1.0 while the Mongo adapters have never run against a live server.
version = "0.3.2"
description = "Event-sourced aggregates on MongoDB: optimistic concurrency, replay, snapshots, idempotent projections"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[tool.setuptools]
packages = [
    "eventstore",
    "eventstore.projections",
    "eventstore.stores",
    "ledger",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
